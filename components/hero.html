<!-- ========================================
     Aeronex - Hero Component
     Cinematic hero section with CTA
     ======================================== -->
<section id="hero" class="min-h-screen flex items-center pt-20 relative overflow-hidden">
  <div class="hero-glow absolute top-1/4 -right-48 opacity-40"></div>
  <div class="hero-glow absolute bottom-0 -left-48 opacity-20" style="background: radial-gradient(circle, rgba(0,229,255,0.25), transparent 70%);"></div>

  <div class="max-w-6xl mx-auto px-6 py-20 w-full">
    <div class="grid lg:grid-cols-2 gap-16 items-center">
      <div class="space-y-8">
        <div id="hero-badge">
          <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-[#6c63ff]/30 text-xs text-gray-300 bg-[#6c63ff]/5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            Next Launch: 2026
          </span>
        </div>
        <h1 id="hero-title" class="font-heading text-5xl md:text-7xl font-bold leading-[1.05] gradient-text">
          The Future<br>Beyond Earth
        </h1>
        <p id="hero-subtitle" class="text-lg md:text-xl text-gray-400 max-w-lg leading-relaxed">
          Pioneering next-generation propulsion, orbital platforms, and autonomous spacecraft for humanity's boldest missions.
        </p>
        <div id="hero-buttons" class="flex flex-wrap gap-4">
          <button class="btn-primary px-8 py-4 rounded-full font-medium text-sm">
            Explore Missions
          </button>
          <button class="btn-secondary px-8 py-4 rounded-full font-medium text-sm border flex items-center gap-2">
            <i data-lucide="play-circle" class="w-4 h-4"></i>
            Watch Launch
          </button>
        </div>
        <div id="hero-stats" class="flex items-center gap-8 pt-6">
          <div>
            <p class="font-heading text-3xl font-bold stat-number"><span class="stat-counter" data-target="47">0</span>+</p>
            <p class="text-xs text-gray-500">Missions Planned</p>
          </div>
          <div class="w-px h-12 bg-white/10"></div>
          <div>
            <p class="font-heading text-3xl font-bold stat-number"><span class="stat-counter" data-target="12">0</span></p>
            <p class="text-xs text-gray-500">Orbital Systems</p>
          </div>
          <div class="w-px h-12 bg-white/10"></div>
          <div>
            <p class="font-heading text-3xl font-bold stat-number">∞</p>
            <p class="text-xs text-gray-500">Possibilities</p>
          </div>
        </div>
      </div>
      <div id="hero-visual" class="relative hidden lg:flex items-center justify-center">
        <!-- Satellite SVG illustration is rendered here -->
      </div>
    </div>
  </div>

  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 scroll-indicator">
    <div class="flex flex-col items-center gap-2 text-gray-500">
      <span class="text-xs tracking-widest uppercase">Scroll</span>
      <i data-lucide="chevron-down" class="w-4 h-4"></i>
    </div>
  </div>
</section>
