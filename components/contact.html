<!-- ========================================
     Aeronex - Contact Component
     Email signup / contact section
     ======================================== -->
<section id="contact" class="py-32 bg-[#08081a]">
  <div class="max-w-3xl mx-auto px-6 text-center reveal-section">
    <span class="text-xs tracking-widest text-[#6c63ff] uppercase font-medium">Get in Touch</span>
    <h2 class="font-heading text-4xl md:text-5xl font-bold mt-4 mb-6 gradient-text-subtle">
      Join the Mission
    </h2>
    <p class="text-gray-400 mb-12">
      Be among the first to learn about our upcoming launches, technology breakthroughs, and partnership opportunities.
    </p>
    <form id="signup-form" class="flex flex-col sm:flex-row gap-4 max-w-md mx-auto">
      <input type="email" placeholder="Enter your email" required class="form-input flex-1 px-6 py-4 rounded-full text-sm">
      <button type="submit" class="btn-primary px-8 py-4 rounded-full font-medium text-sm whitespace-nowrap">
        Request Access
      </button>
    </form>
    <p class="text-xs text-gray-600 mt-6">
      By signing up, you agree to receive mission updates from Aeronex. No spam, ever.
    </p>
  </div>
</section>
